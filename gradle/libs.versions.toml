[versions]
agp = "9.4.1"
kotlin = "2.1.21"
core-ktx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
