# ───────────────────
# Pull Request — Debug APK Build & Comment
# Triggered on every pull request targeting any branch.
# Cancels any in-progress run for the same PR when a new commit is pushed,
# so only the latest commit's build result ever posts to the PR.
# ───────────────────

name: Build Debug APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "fastlane/**"
      - "**/*.md"
      - "LICENSE"

# One concurrent run per PR. New pushes cancel the previous run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Java setup
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # Gradle permissions
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Extract version from build.gradle.kts
      - name: Extract app version info
        id: version
        run: |
          INFO=$(./gradlew -q app:printAppInfo)

          VERSION=$(echo "$INFO" | jq -r '.version')
          VERSION_CODE=$(echo "$INFO" | jq -r '.versionCode')
          VERSION_MAJOR=$(echo "$INFO" | jq -r '.versionMajor')

          cat <<EOF >> "$GITHUB_OUTPUT"
          version=$VERSION
          version_code=$VERSION_CODE
          version_major=$VERSION_MAJOR
          EOF

      # Build Debug APK
      - name: Build debug APK
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Rename APK for clarity
      - name: Rename APK artifact
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Debug APK not found"
            exit 1
          fi
          cp "$APK_PATH" "artifacts/DhwaniControl-v${{ steps.version.outputs.version }}-debug.apk"

      # Upload artifact
      - name: Upload debug APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: DhwaniControl-v${{ steps.version.outputs.version }}-debug-PR${{ github.event.pull_request.number }}
          path: artifacts/DhwaniControl-v${{ steps.version.outputs.version }}-debug.apk
          retention-days: 60

      # Delete old bot comment if exists
      - name: Delete old APK comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo     = context.repo;
            
            const { data: comments } = await github.rest.issues.listComments({
              ...repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.body.includes('<!-- pr-debug-apk-build-test_cmt -->')
            );

            if (botComment) {
              await github.rest.issues.deleteComment({
                ...repo,
                comment_id: botComment.id,
              });
              console.log(`Deleted old bot comment: ${botComment.id}`);
            } else {
              console.log('No previous bot comment found, skipping delete.');
            }
      
      # Post comment on PR
      - name: Post APK download comment on PR
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber   = context.payload.pull_request.number;
            const version    = process.env.VERSION;
            const runNumber  = process.env.RUN_NUMBER;
            const runId      = context.runId;
            const repo       = context.repo;
            const artifactId = process.env.ARTIFACT_ID;
            const artifactName = `DhwaniControl-v${version}-debug-PR${prNumber}`;
            const downloadVersion = `${version}+${runNumber}`;

            const runUrl      = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            const artifactUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}/artifacts/${artifactId}`;
            
            const badgeUrl = `https://img.shields.io/badge/Download%20APK-v${downloadVersion}-4CAF50?style=for-the-badge&logo=android&logoColor=white`;
            const buildPassingBadge = `https://img.shields.io/badge/debug_build-passing-brightgreen?style=for-the-badge&logo=android`
            
            const commentBody = `<!-- pr-debug-apk-build-test_cmt -->
            
            ## ✅ Debug APK Build Successful

            [![Build Passing](${buildPassingBadge})](${runUrl})

            | Detail | Value |
            |--------|-------|
            | **Version** | \`v${version}\` |
            | **Build** | \`#${runNumber}\` |
            | **PR** | #${prNumber} |
            | **Artifact** | \`${artifactName}\` |
            | **Expires** | 60 days |

            ---

            ### 📲 Download

            [![Download APK v${downloadVersion}](${badgeUrl})](${artifactUrl})

            > **How to download:** Click the badge above or [click here](${artifactUrl})

            ---
            <sub>🤖 This comment is auto-generated by the PR Debug APK build workflow.</sub>`;

            await github.rest.issues.createComment({
              ...repo,
              issue_number: prNumber,
              body: commentBody,
            });
