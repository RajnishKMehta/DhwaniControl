version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: dependency
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    target-branch: dependency
    open-pull-requests-limit: 10
    groups:
      gradle-dependencies:
        patterns:
          - "*"
