name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
assignees:
 - RajnishKMehta
type: Bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, attach screenshots or screen recordings to help explain the problem.
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device
      description: Which device are you using?
      placeholder: e.g. Moto G73
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: Which Android version is your device running?
      placeholder: e.g. 14
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of DhwaniControl are you using?
      placeholder: e.g. 1.4.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
